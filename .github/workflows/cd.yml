name: CD

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from release tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG (expected semver with 'v' prefix, e.g. v0.1.0)"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "Version mismatch: package.json is $PKG_VERSION, release tag is ${{ steps.version.outputs.VERSION }}"
            exit 1
          fi
          echo "Versions match: $PKG_VERSION"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Update release with npm link
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CURRENT_BODY=$(gh api "repos/${{ github.repository }}/releases/${{ github.event.release.id }}" --jq .body)
          NEW_BODY="${CURRENT_BODY}

          ---

          📦 Published to npm as [\`no-more-bs@${VERSION}\`](https://www.npmjs.com/package/no-more-bs/v/${VERSION})"
          gh api "repos/${{ github.repository }}/releases/${{ github.event.release.id }}" -X PATCH -f body="$NEW_BODY"
        env:
          GH_TOKEN: ${{ github.token }}
